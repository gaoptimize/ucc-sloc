[project]
name = "uccskill"
version = "0.1.0"
description = "Physical and logical SLOC for Python, JavaScript, TypeScript, SQL, HTML, and CSS."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
ucc-sloc = "uccskill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
